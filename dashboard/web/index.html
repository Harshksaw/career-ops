<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career-Ops Portal Scan Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Career-Ops</p>
          <h1>Portal Scan Viewer</h1>
          <p class="lede">
            Browse saved portal scans without digging through markdown. Filter by fit,
            queue status, company, platform, or search terms.
          </p>
        </div>
        <div class="hero-controls">
          <label class="field compact">
            <span>Scan Date</span>
            <select id="scan-select"></select>
          </label>
          <button id="refresh-button" class="ghost">Refresh</button>
        </div>
      </header>

      <section class="summary-grid" id="summary-grid"></section>

      <section class="priority-panel detail-card">
        <p class="eyebrow">Apply Next</p>
        <div id="priority-root" class="priority-root"></div>
      </section>

      <section class="control-bar">
        <label class="field search">
          <span>Search</span>
          <input id="search-input" type="search" placeholder="Company, role, location" />
        </label>
        <label class="field">
          <span>Fit Bucket</span>
          <select id="fit-filter">
            <option value="all">All buckets</option>
          </select>
        </label>
        <label class="field">
          <span>Platform</span>
          <select id="platform-filter">
            <option value="all">All platforms</option>
          </select>
        </label>
        <label class="field">
          <span>Company</span>
          <select id="company-filter">
            <option value="all">All companies</option>
          </select>
        </label>
        <label class="field">
          <span>Queue State</span>
          <select id="queue-filter">
            <option value="all">All roles</option>
            <option value="queued">Queued in pipeline</option>
            <option value="unqueued">Not queued</option>
          </select>
        </label>
        <label class="field">
          <span>Sort</span>
          <select id="sort-filter">
            <option value="fit">Fit bucket</option>
            <option value="company">Company</option>
            <option value="published">Published</option>
          </select>
        </label>
      </section>

      <main class="layout">
        <section class="results-panel">
          <div class="results-head">
            <div>
              <p class="eyebrow">Visible Roles</p>
              <h2 id="results-count">0 roles</h2>
            </div>
            <p id="results-context" class="muted"></p>
          </div>
          <div id="roles-root" class="role-groups"></div>
        </section>

        <aside class="detail-panel">
          <div class="detail-card">
            <p class="eyebrow">Role Detail</p>
            <div id="detail-root" class="detail-empty">
              Select a role to inspect the metadata and open the source listing.
            </div>
          </div>

          <div class="detail-card">
            <p class="eyebrow">Source Issues</p>
            <div id="issues-root" class="issues-list"></div>
          </div>
        </aside>
      </main>
    </div>

    <script defer src="/app.js"></script>
  </body>
</html>
